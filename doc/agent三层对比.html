<script>
(function () {
  const frames = Array.from(document.querySelectorAll('.frame'));
  const btn = document.getElementById('btnPresent');
  const pager = document.getElementById('pager');
  let i = 0;
  let present = false;

  function show(n) {
    i = Math.max(0, Math.min(frames.length - 1, n));
    frames.forEach((f, k) => f.classList.toggle('current', k === i));
    if (pager) pager.textContent = (i + 1) + ' / ' + frames.length;
    if (present) frames[i].scrollIntoView({ block: 'start' });
  }

  function togglePresent() {
    present = !present;
    document.body.classList.toggle('present', present);
    btn.textContent = present ? '退出演示' : '演示模式';
    if (present) show(i);
    else frames.forEach(f => f.classList.remove('current'));
  }

  btn.addEventListener('click', togglePresent);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'f' || e.key === 'F' || e.key === 'p' || e.key === 'P') {
      if (e.target && /input|textarea/i.test(e.target.tagName)) return;
      togglePresent();
    }
    if (!present) return;
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') {
      e.preventDefault(); show(i + 1);
    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
      e.preventDefault(); show(i - 1);
    } else if (e.key === 'Escape') {
      if (present) togglePresent();
    }
  });
})();
</script>
